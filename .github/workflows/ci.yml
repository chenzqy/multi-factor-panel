name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试（${{ matrix.os }} / py${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 语法编译检查（全部 .py）
        run: python -m compileall -q desktop_app.py mcp_server.py launcher.pyw src tests

      - name: 运行单元测试
        run: python -m pytest -q --maxfail=1

  lint-encoding:
    name: 编码与卫生检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 所有文本文件必须是 UTF-8
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              echo "::error file=$f::不是合法的 UTF-8"
              fail=1
            fi
          done < <(find . -path ./.git -prune -o -type f \
                    \( -name '*.py' -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' \
                       -o -name '*.txt' -o -name '*.csv' -o -name '*.spec' -o -name '*.bat' -o -name '*.pyw' \) -print0)
          exit $fail

      - name: 禁止提交敏感信息
        run: |
          set -e
          echo "检查 API Key / 私钥 / 本机路径……"
          if grep -rInE 'sk-[A-Za-z0-9]{16,}' --include='*.py' --include='*.yaml' --include='*.yml' --include='*.json' . ; then
            echo "::error::发现疑似 API Key"; exit 1
          fi
          if grep -rIn --include='*.py' --include='*.md' -E 'C:\\\\Users\\\\[A-Za-z0-9_]+' . ; then
            echo "::error::发现本机绝对路径"; exit 1
          fi
          if [ -f config/ui_state.json ]; then
            echo "::error::config/ui_state.json 是运行期状态，不应入仓"; exit 1
          fi
          echo "OK"
